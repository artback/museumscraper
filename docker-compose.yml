services:
  # Official Apache image running in KRaft mode. The Bitnami kafka tags this
  # project used previously were withdrawn from Docker Hub.
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: museum-local-cluster-1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/bin/bash", "/create_topic.sh"]
    volumes:
      - type: bind
        source: ./create_topic.sh
        target: /create_topic.sh
    env_file: .env

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BROKER}
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    env_file: .env
    environment:
      # Declares the Kafka notification target. create_event.sh then attaches a
      # bucket rule to this target (arn:minio:sqs::1:kafka).
      MINIO_NOTIFY_KAFKA_ENABLE_1: "on"
      MINIO_NOTIFY_KAFKA_BROKERS_1: ${KAFKA_BROKER}
      MINIO_NOTIFY_KAFKA_TOPIC_1: ${KAFKA_TOPIC}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # PostGIS image rather than plain Postgres: the radius queries need PostGIS,
  # and pg_trgm — which gives the similarity matching — ships with contrib in
  # both.
  postgres:
    image: postgis/postgis:16-3.4
    container_name: museum-postgres
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: museum
      POSTGRES_PASSWORD: museum
      POSTGRES_DB: museum
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum -d museum"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # Application. One image, one binary; each service is a different subcommand.
  # ---------------------------------------------------------------------------

  # The HTTP API. This is the only service that needs to be reachable.
  api:
    build: .
    container_name: museum-api
    command: ["serve", "-addr", ":8090"]
    ports:
      - "8090:8090"
    env_file: .env
    environment:
      # Inside the compose network the services are addressed by name, not
      # through the host's published ports.
      MINIO_ENDPOINT: minio:9000
      KAFKA_BROKER_LOCAL: kafka:9092
      DATABASE_URL: postgres://museum:museum@postgres:5432/museum?sslmode=disable
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Long-running consumer: geocodes each museum as it is stored.
  enricher:
    build: .
    container_name: museum-enricher
    command: ["enrich"]
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio:9000
      KAFKA_BROKER_LOCAL: kafka:9092
      DATABASE_URL: postgres://museum:museum@postgres:5432/museum?sslmode=disable
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Batch jobs and operator tools. One service, because "docker compose run"
  # replaces a service's command outright — giving each job its own service with
  # a baked-in subcommand meant the subcommand was dropped the moment you passed
  # a flag, and the binary printed its help instead of running.
  #
  #   docker compose run --rm jobs crawl
  #   docker compose run --rm jobs refresh -place "Paris, France" -radius 3
  #   docker compose run --rm jobs reindex
  #   docker compose run --rm jobs verify -samples 3
  #   docker compose run --rm jobs query museums -lat 48.8566 -lon 2.3522
  # ---------------------------------------------------------------------------

  jobs:
    build: .
    profiles: ["jobs"]
    command: ["help"]
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio:9000
      KAFKA_BROKER_LOCAL: kafka:9092
      DATABASE_URL: postgres://museum:museum@postgres:5432/museum?sslmode=disable
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Creates the bucket and wires its ObjectCreated events to Kafka.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/create_event.sh"]
    env_file: .env
    volumes:
      - type: bind
        source: ./create_event.sh
        target: /create_event.sh

volumes:
  minio_data:
  kafka_data:
  postgres_data:
