<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Museum catalogue</title>
<link rel="stylesheet" href="/map/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/map/assets/app.css">
</head>
<body>
<h1 class="sr">Museum catalogue</h1>

<div id="map"></div>

<!-- Left edge is input. The results are a listbox rather than a stack of
     clickable divs, so the arrow-key cursor is something a screen reader can
     follow rather than only a background colour. -->
<div class="panel" id="search">
  <input id="q" type="search" placeholder="Search a city or a museum…"
         autocomplete="off" spellcheck="false"
         role="combobox" aria-expanded="false" aria-controls="results"
         aria-autocomplete="list" aria-label="Search for a city or a museum">
  <ul id="results" role="listbox" aria-label="Search results"></ul>
</div>

<!-- Right edge is output: one column, cards stacked in it. -->
<div id="dock" aria-label="Details"></div>

<button id="look" class="pill" type="button" hidden>Look for exhibitions here</button>

<!-- The visible status line, and the channel that says the same things to a
     screen reader. Two elements because the visible one is rewritten on every
     settled pan, and narrating that would be unusable. -->
<div id="hud" aria-hidden="true"><span id="hudCount"></span><span id="hudNote"></span></div>
<div id="announce" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="/map/vendor/maplibre-gl.js"></script>
<script type="module" src="/map/assets/app.js"></script>
</body>
</html>
