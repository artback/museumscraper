<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum catalogue</title>
<style>
  :root {
    --bg: #06080d;
    --ink: #e8edf5;
    --dim: #8b97ab;
    --line: #1d2634;
    --panel: #0d121b;
    --accent: #ffb454;
    --sea: #0b1220;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .panel {
    position: absolute; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }

  /* Search, top left, as asked. */
  #search { top: 16px; left: 16px; width: 330px; overflow: hidden; }
  #search input {
    width: 100%; padding: 12px 14px; border: 0; outline: 0;
    background: transparent; color: var(--ink); font-size: 15px;
  }
  #search input::placeholder { color: var(--dim); }
  #results { max-height: 46vh; overflow-y: auto; border-top: 1px solid var(--line); }
  #results:empty { border-top: 0; }
  .hit { padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .hit:last-child { border-bottom: 0; }
  .hit:hover, .hit[aria-selected="true"] { background: #151d2a; }
  .hit b { font-weight: 600; }
  .hit small { color: var(--dim); display: block; }

  /* The pop-up window for a museum. */
  #detail { top: 16px; right: 16px; width: 340px; padding: 16px; display: none; }
  #detail h2 { margin: 0 26px 4px 0; font-size: 17px; line-height: 1.25; }
  #detail .where { color: var(--dim); margin-bottom: 10px; }
  #detail .desc { margin-bottom: 12px; }
  #detail a { color: var(--accent); }
  #close {
    position: absolute; top: 10px; right: 12px; cursor: pointer;
    color: var(--dim); background: 0; border: 0; font-size: 20px; line-height: 1;
  }
  #close:hover { color: var(--ink); }
  .tag {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--dim); margin: 0 4px 6px 0;
  }
  .shows { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  .shows h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
              color: var(--dim); margin: 0 0 8px; }
  .show { margin-bottom: 9px; }
  .show .when { color: var(--dim); font-size: 12px; }

  #hud {
    position: absolute; left: 16px; bottom: 14px;
    color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  #hud kbd {
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
    color: var(--ink); font: inherit;
  }
  #tip {
    position: absolute; pointer-events: none; display: none;
    background: #0d121bee; border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 9px; font-size: 12px; white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="globe"></canvas>

<div class="panel" id="search">
  <input id="q" type="search" placeholder="Search museums…" autocomplete="off" spellcheck="false">
  <div id="results"></div>
</div>

<div class="panel" id="detail">
  <button id="close" title="Close">&times;</button>
  <div id="detailBody"></div>
</div>

<div id="hud"></div>
<div id="tip"></div>

<script>
"use strict";

const canvas = document.getElementById("globe");
const ctx = canvas.getContext("2d", { alpha: false });
const hud = document.getElementById("hud");
const tip = document.getElementById("tip");

// View state. Rotation is where the globe is spun to; zoom scales the sphere.
const view = { lon: 10, lat: 25, zoom: 1, points: [], truncated: false };
const RAD = Math.PI / 180;

let width = 0, height = 0, radius = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  radius = Math.min(width, height) * 0.42;
  draw();
}
window.addEventListener("resize", resize);

// Orthographic projection: the view you get looking at a sphere from far away.
// Returns null for anything on the far side, which is what makes it a globe
// rather than a flat map with the back showing through.
function project(lat, lon) {
  const phi = lat * RAD, lambda = (lon - view.lon) * RAD;
  const phi0 = view.lat * RAD;
  const cosc = Math.sin(phi0) * Math.sin(phi) +
               Math.cos(phi0) * Math.cos(phi) * Math.cos(lambda);
  if (cosc < 0) return null;
  const r = radius * view.zoom;
  return {
    x: width / 2 + r * Math.cos(phi) * Math.sin(lambda),
    y: height / 2 - r * (Math.cos(phi0) * Math.sin(phi) -
                         Math.sin(phi0) * Math.cos(phi) * Math.cos(lambda)),
    depth: cosc,
  };
}

// The inverse, for turning a click back into a position on the globe.
function unproject(x, y) {
  const r = radius * view.zoom;
  const dx = x - width / 2, dy = height / 2 - y;
  const rho = Math.hypot(dx, dy);
  if (rho > r) return null;
  const c = Math.asin(Math.min(rho / r, 1));
  const phi0 = view.lat * RAD;
  const lat = Math.asin(Math.cos(c) * Math.sin(phi0) +
                        (rho ? dy * Math.sin(c) * Math.cos(phi0) / rho : 0)) / RAD;
  const lon = view.lon + Math.atan2(
    dx * Math.sin(c),
    rho * Math.cos(c) * Math.cos(phi0) - dy * Math.sin(c) * Math.sin(phi0)) / RAD;
  return { lat, lon: ((lon + 540) % 360) - 180 };
}

function drawGraticule() {
  const r = radius * view.zoom;
  ctx.strokeStyle = "#141c28";
  ctx.lineWidth = 1;
  for (let lat = -60; lat <= 60; lat += 30) {
    ctx.beginPath();
    let started = false;
    for (let lon = -180; lon <= 180; lon += 3) {
      const p = project(lat, lon);
      if (!p) { started = false; continue; }
      started ? ctx.lineTo(p.x, p.y) : (ctx.moveTo(p.x, p.y), started = true);
    }
    ctx.stroke();
  }
  for (let lon = -180; lon < 180; lon += 30) {
    ctx.beginPath();
    let started = false;
    for (let lat = -90; lat <= 90; lat += 3) {
      const p = project(lat, lon);
      if (!p) { started = false; continue; }
      started ? ctx.lineTo(p.x, p.y) : (ctx.moveTo(p.x, p.y), started = true);
    }
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(width / 2, height / 2, r, 0, Math.PI * 2);
  ctx.strokeStyle = "#223047";
  ctx.stroke();
}

let selected = null;

function draw() {
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--bg");
  ctx.fillRect(0, 0, width, height);

  const r = radius * view.zoom;
  ctx.beginPath();
  ctx.arc(width / 2, height / 2, r, 0, Math.PI * 2);
  ctx.fillStyle = "#0a101a";
  ctx.fill();

  drawGraticule();

  // No basemap and no tiles: at 154,000 museums the points draw the coastlines
  // themselves, which is both the honest picture of the data and the reason
  // this page needs nothing from the network but its own API.
  const size = view.zoom < 2 ? 1.1 : view.zoom < 6 ? 1.6 : 2.4;
  ctx.fillStyle = "#5ec8ff";
  ctx.globalAlpha = view.zoom < 2 ? 0.72 : 0.9;
  for (const p of view.points) {
    const q = project(p[1], p[2]);
    if (!q) continue;
    ctx.beginPath();
    ctx.arc(q.x, q.y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (selected && Number.isFinite(selected.latitude)) {
    const q = project(selected.latitude, selected.longitude);
    if (q) {
      ctx.beginPath();
      ctx.arc(q.x, q.y, 7, 0, Math.PI * 2);
      ctx.strokeStyle = "#ffb454";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  hud.innerHTML =
    view.points.length.toLocaleString() + " museums shown" +
    (view.truncated ? " (most notable — zoom in for the rest)" : "") +
    " &nbsp;·&nbsp; drag to spin &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; " +
    "<kbd>click</kbd> a point";
}

// Loading is debounced and keyed to the visible box, so spinning the globe does
// not queue a request per frame.
let loadTimer = null, loadToken = 0;

function visibleBox() {
  if (view.zoom < 1.6) return null;
  const corners = [
    unproject(0, 0), unproject(width, 0),
    unproject(0, height), unproject(width, height),
    unproject(width / 2, height / 2),
  ].filter(Boolean);
  if (corners.length < 3) return null;

  const lats = corners.map(c => c.lat), lons = corners.map(c => c.lon);
  // A box spanning the wrap-around would be inside out; fall back to the world.
  if (Math.max(...lons) - Math.min(...lons) > 180) return null;
  const pad = 0.15;
  return [
    Math.min(...lons) - pad, Math.min(...lats) - pad,
    Math.max(...lons) + pad, Math.max(...lats) + pad,
  ];
}

function scheduleLoad() {
  clearTimeout(loadTimer);
  loadTimer = setTimeout(loadPoints, 220);
}

async function loadPoints() {
  const token = ++loadToken;
  const box = visibleBox();
  const url = "/v1/points?limit=40000" + (box ? "&bbox=" + box.join(",") : "");
  try {
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    if (token !== loadToken) return; // a newer view has already been requested
    view.points = data.points;
    view.truncated = data.truncated;
    draw();
  } catch (_) { /* a failed refresh leaves the previous points on screen */ }
}

/* ---- interaction ------------------------------------------------------- */

let dragging = false, moved = false, last = null;

canvas.addEventListener("pointerdown", e => {
  dragging = true; moved = false;
  last = { x: e.clientX, y: e.clientY };
  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", e => {
  if (!dragging) { hover(e); return; }
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  last = { x: e.clientX, y: e.clientY };

  // Slower rotation when zoomed in, or the globe becomes unusable up close.
  const k = 0.35 / view.zoom;
  view.lon -= dx * k;
  view.lat = Math.max(-89, Math.min(89, view.lat + dy * k));
  draw();
  scheduleLoad();
});

function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove("dragging");
  if (!moved) pick(e);
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", () => { dragging = false; canvas.classList.remove("dragging"); });

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0016);
  view.zoom = Math.max(1, Math.min(220, view.zoom * factor));
  draw();
  scheduleLoad();
}, { passive: false });

// Finding what was clicked: nearest drawn point within a few pixels.
function nearest(x, y, maxPx) {
  let best = null, bestDist = maxPx * maxPx;
  for (const p of view.points) {
    const q = project(p[1], p[2]);
    if (!q) continue;
    const d = (q.x - x) ** 2 + (q.y - y) ** 2;
    if (d < bestDist) { bestDist = d; best = p; }
  }
  return best;
}

async function pick(e) {
  const hit = nearest(e.clientX, e.clientY, 9);
  if (!hit) return;
  await showMuseum(hit[0]);
}

let hoverTimer = null;
function hover(e) {
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(async () => {
    const hit = nearest(e.clientX, e.clientY, 7);
    if (!hit) { tip.style.display = "none"; return; }
    try {
      const res = await fetch("/v1/museums/" + hit[0]);
      if (!res.ok) return;
      const m = await res.json();
      tip.textContent = m.name;
      tip.style.display = "block";
      tip.style.left = (e.clientX + 14) + "px";
      tip.style.top = (e.clientY + 14) + "px";
    } catch (_) {}
  }, 90);
}

/* ---- the museum window -------------------------------------------------- */

const detail = document.getElementById("detail");
const detailBody = document.getElementById("detailBody");
document.getElementById("close").onclick = () => {
  detail.style.display = "none";
  selected = null;
  draw();
};

function escape(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function showMuseum(id) {
  const res = await fetch("/v1/museums/" + encodeURIComponent(id));
  if (!res.ok) return;
  const m = await res.json();
  selected = m;

  const where = [m.locality, m.country].filter(Boolean).join(", ");
  const tags = [];
  if (m.verified) tags.push("Wikipedia article");
  if (m.approximate_location) tags.push("position approximate — town centre");

  detailBody.innerHTML =
    "<h2>" + escape(m.name) + "</h2>" +
    (where ? '<div class="where">' + escape(where) + "</div>" : "") +
    tags.map(t => '<span class="tag">' + escape(t) + "</span>").join("") +
    (m.description ? '<div class="desc">' + escape(m.description) + "</div>" : "") +
    (m.website ? '<div><a href="' + escape(m.website) + '" target="_blank" rel="noopener">Website</a></div>' : "") +
    (m.wikipedia_url ? '<div><a href="' + escape(m.wikipedia_url) + '" target="_blank" rel="noopener">Wikipedia</a></div>' : "") +
    '<div class="shows" id="shows"><h3>What\'s on</h3><div class="where">Looking…</div></div>';

  detail.style.display = "block";

  // Centre the globe on it, so a search result is actually shown.
  if (Number.isFinite(m.latitude) && (m.latitude !== 0 || m.longitude !== 0)) {
    view.lat = m.latitude;
    view.lon = m.longitude;
    view.zoom = Math.max(view.zoom, 28);
    scheduleLoad();
  }
  draw();
  loadShows(m);
}

async function loadShows(m) {
  const box = document.getElementById("shows");
  if (!Number.isFinite(m.latitude)) { box.innerHTML = ""; return; }
  try {
    const res = await fetch("/v1/exhibitions?lat=" + m.latitude + "&lon=" + m.longitude +
                            "&radius_km=1&upcoming=true&limit=25");
    const data = await res.json();
    // Exhibitions are held per venue, so the ones at this museum are those
    // whose museum name matches; the radius is only how they are found.
    const mine = data.exhibitions.filter(e => e.museum === m.name);
    if (!mine.length) {
      const note = data.coverage && data.coverage.last_scraped
        ? "Nothing listed for this museum."
        : "This area has not been scraped yet.";
      box.innerHTML = "<h3>What's on</h3><div class=\"where\">" + note + "</div>";
      return;
    }
    box.innerHTML = "<h3>What's on</h3>" + mine.map(e => {
      const when = [e.start ? "from " + e.start.slice(0, 10) : "",
                    e.end ? "until " + e.end.slice(0, 10) : ""].filter(Boolean).join(" ");
      const title = e.url
        ? '<a href="' + escape(e.url) + '" target="_blank" rel="noopener">' + escape(e.title) + "</a>"
        : escape(e.title);
      return '<div class="show">' + title +
             (when ? '<div class="when">' + escape(when) + "</div>" : "") + "</div>";
    }).join("");
  } catch (_) {
    box.innerHTML = "<h3>What's on</h3><div class=\"where\">Could not load.</div>";
  }
}

/* ---- search ------------------------------------------------------------- */

const q = document.getElementById("q");
const results = document.getElementById("results");
let searchTimer = null, searchToken = 0;

q.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const term = q.value.trim();
  if (!term) { results.innerHTML = ""; return; }
  searchTimer = setTimeout(() => runSearch(term), 180);
});

async function runSearch(term) {
  const token = ++searchToken;
  try {
    const res = await fetch("/v1/search?q=" + encodeURIComponent(term) + "&limit=12");
    if (!res.ok) return;
    const data = await res.json();
    if (token !== searchToken) return;

    if (!data.museums.length) {
      results.innerHTML = '<div class="hit"><small>Nothing found</small></div>';
      return;
    }
    results.innerHTML = data.museums.map(m =>
      '<div class="hit" data-id="' + m.id + '">' +
      "<b>" + escape(m.name) + "</b>" +
      "<small>" + escape([m.locality, m.country].filter(Boolean).join(", ")) +
      (m.locatable ? "" : " · position unknown") + "</small></div>").join("");

    for (const el of results.querySelectorAll(".hit[data-id]")) {
      el.onclick = () => showMuseum(el.dataset.id);
    }
  } catch (_) {}
}

resize();
loadPoints();
</script>
</body>
</html>
