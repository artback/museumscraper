<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum catalogue</title>
<link rel="stylesheet" href="/map/vendor/maplibre-gl.css">
<style>
  :root {
    --ink: #e9eef6; --dim: #93a0b4; --line: #223047;
    --panel: #0e1420f2; --accent: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #05070c; color: var(--ink);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute; background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 14px 44px rgba(0,0,0,.6);
  }

  /* Search, top left. */
  #search { top: 14px; left: 14px; width: 330px; overflow: hidden; z-index: 5; }
  #search input {
    width: 100%; padding: 12px 14px; border: 0; outline: 0;
    background: transparent; color: var(--ink); font-size: 15px;
  }
  #search input::placeholder { color: var(--dim); }
  #results { max-height: 44vh; overflow-y: auto; }
  #results:not(:empty) { border-top: 1px solid var(--line); }
  .hit { padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .hit:last-child { border-bottom: 0; }
  .hit:hover, .hit.active { background: #1a2434; }
  .hit b { font-weight: 600; }
  .hit small { color: var(--dim); display: block; }

  /* The museum window. */
  #detail { top: 14px; right: 14px; width: 340px; padding: 16px; display: none;
            max-height: calc(100vh - 28px); overflow-y: auto; z-index: 5; }
  #detail h2 { margin: 0 26px 4px 0; font-size: 17px; line-height: 1.25; }
  #detail .where { color: var(--dim); margin-bottom: 10px; }
  #detail .desc { margin-bottom: 12px; }
  #detail a { color: var(--accent); }
  .closer { position: absolute; top: 10px; right: 12px; cursor: pointer;
            color: var(--dim); background: 0; border: 0; font-size: 20px; line-height: 1; }
  .closer:hover { color: var(--ink); }

  /* Everything in the area you just searched for. */
  #list { top: 14px; right: 14px; width: 300px; display: none; z-index: 4;
          max-height: calc(100vh - 28px); overflow-y: auto; padding: 14px; }
  #list h2 { margin: 0 26px 2px 0; font-size: 15px; }
  #list .count { color: var(--dim); margin-bottom: 10px; font-size: 12px; }
  #list .row { padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer; }
  #list .row:hover { color: var(--accent); }
  #list .row small { color: var(--dim); display: block; }
  /* When a museum is open, the list steps aside rather than stacking on it. */
  #detail:not([style*="none"]) ~ #list { display: none !important; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 99px;
         border: 1px solid var(--line); color: var(--dim); margin: 0 4px 6px 0; }
  .shows { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  .shows h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
              color: var(--dim); margin: 0 0 8px; }
  .show { margin-bottom: 9px; }
  .show .when { color: var(--dim); font-size: 12px; }

  #hud { position: absolute; left: 14px; bottom: 34px; z-index: 5; max-width: 46vw;
         color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums;
         text-shadow: 0 1px 3px #000; }
  #hud b { color: var(--ink); font-weight: 600; }

  /* MapLibre's own popup, restyled to match. */
  .maplibregl-popup-content {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 11px; font: inherit;
  }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important;
                          border-bottom-color: var(--panel) !important; }
  .maplibregl-ctrl-group { background: var(--panel); }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="search">
  <input id="q" type="search" placeholder="Search museums…" autocomplete="off" spellcheck="false">
  <div id="results"></div>
</div>

<div class="panel" id="list">
  <button class="closer" id="listClose" title="Close">&times;</button>
  <div id="listBody"></div>
</div>

<div class="panel" id="detail">
  <button class="closer" id="close" title="Close">&times;</button>
  <div id="detailBody"></div>
</div>

<div id="hud"></div>

<script src="/map/vendor/maplibre-gl.js"></script>
<script>
"use strict";

// Raster OpenStreetMap tiles, which carry the thing a hand-drawn globe cannot:
// city names, roads, coastlines at every scale, in the local language.
//
// The style is defined here rather than fetched so the application depends on
// exactly one external thing — the tiles — and that one is swappable. A
// deployment with a MapTiler or Stadia key should point TILES at it; the OSM
// community servers are fine for a desktop tool but are not a CDN and their
// usage policy is explicit about that.
const TILES = (window.MUSEUM_TILES || [
  "https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png",
  "https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png",
  "https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png",
  "https://d.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png",
]);

const TILE_ATTRIBUTION = window.MUSEUM_TILE_ATTRIBUTION ||
  '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, ' +
  '© <a href="https://carto.com/attributions">CARTO</a>';

// Glyphs are what lets the map draw text — without them any layer with a
// text-field is rejected outright, which is what silently stopped the cluster
// labels and every layer declared after them.
const GLYPHS = window.MUSEUM_GLYPHS ||
  "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf";

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    glyphs: GLYPHS,
    sources: {
      osm: {
        type: "raster",
        tiles: TILES,
        // 512 to match the @2x tiles: telling MapLibre the wrong size makes
        // every label render at half the intended scale.
        tileSize: 512,
        maxzoom: 19,
        attribution: TILE_ATTRIBUTION,
      },
    },
    layers: [
      { id: "background", type: "background", paint: { "background-color": "#081020" } },
      { id: "osm", type: "raster", source: "osm" },
    ],
    // Declared in the style rather than set afterwards. Calling
    // map.setProjection() straight after the constructor throws, because the
    // style has not loaded yet — and since function declarations hoist, the
    // rest of this file still *looked* defined while the script had in fact
    // stopped at that line, leaving a black page with no error to see.
    projection: { type: "globe" },
    sky: {
      "sky-color": "#0a1a33",
      "horizon-color": "#12233d",
      "fog-color": "#05070c",
      "sky-horizon-blend": 0.6,
      "horizon-fog-blend": 0.6,
      "fog-ground-blend": 0.1,
      "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 0.9, 6, 0.3, 9, 0],
    },
  },
  center: [10, 30],
  // Not lower: at zoom 1.4 the globe is smaller than the window and sits in a
  // black void while the first tiles arrive, which reads as a broken page.
  zoom: 2.2,
  minZoom: 1.4,
  hash: true,          // the view lives in the URL, so a view can be shared
  attributionControl: { compact: true },
});

// Anything the map itself reports — a refused tile, a bad style — should be
// visible rather than swallowed, since a map that fails silently is just a
// black rectangle.
map.on("error", e => console.error("map:", e && e.error ? e.error.message : e));

map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-right");
// Geolocation needs a secure context and a permission; where it is
// unavailable MapLibre disables the control itself rather than failing.
map.addControl(new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: true,
  showUserLocation: true,
}), "bottom-right");

const hud = document.getElementById("hud");

// Adding layers one at a time and reporting failures individually. Declared as
// a list rather than a run of statements because a throw partway through a
// setup function leaves the map half-built with nothing to say so.
function addLayerSafely(spec) {
  try {
    map.addLayer(spec);
  } catch (err) {
    console.error("map: could not add layer " + spec.id + ": " + err.message);
  }
}

map.on("load", () => {
  map.addSource("museums", {
    type: "geojson",
    data: { type: "FeatureCollection", features: [] },
    // Not clustered. Clustering replaced the map with a few dozen large discs
    // and hid the thing worth looking at — that the museums themselves trace
    // the cities. Forty thousand small circles is a shape the GPU draws in one
    // pass and a person reads at a glance.
  });

  addLayerSafely({
    id: "museum-points", type: "circle", source: "museums",
    paint: {
      "circle-color": "#ffb454",
      "circle-radius": [
        "interpolate", ["linear"], ["zoom"],
        1.5, 1.4, 4, 2.2, 8, 3.5, 12, 5.5, 16, 8,
      ],
      // No outline until the dots are big enough for one to be a border rather
      // than most of the dot.
      "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 6, 0, 9, 1],
      "circle-stroke-color": "#2a1b06",
      "circle-opacity": ["interpolate", ["linear"], ["zoom"], 1.5, 0.85, 6, 1],
    },
  });
  // A halo for whichever museum is open, so it is findable among its neighbours.
  addLayerSafely({
    id: "museum-selected", type: "circle", source: "museums",
    filter: ["==", ["get", "id"], -1],
    paint: {
      "circle-color": "transparent", "circle-radius": 13,
      "circle-stroke-width": 3, "circle-stroke-color": "#ffffff",
    },
  });

  loadPoints();
  map.on("moveend", onMoved);

  map.on("click", "museum-points", e => showMuseum(e.features[0].properties.id));

  for (const layer of ["museum-points"]) {
    map.on("mouseenter", layer, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", layer, () => map.getCanvas().style.cursor = "");
  }

  // A name on hover, without a request per pixel.
  const hoverPopup = new maplibregl.Popup({
    closeButton: false, closeOnClick: false, offset: 12,
  });
  map.on("mousemove", "museum-points", e => {
    const name = e.features[0].properties.name;
    if (!name) return;
    hoverPopup.setLngLat(e.features[0].geometry.coordinates).setText(name).addTo(map);
  });
  map.on("mouseleave", "museum-points", () => hoverPopup.remove());
});

/* ---- points ------------------------------------------------------------- */

let loadToken = 0, moveTimer = null;

// One handler for "the view settled", debounced. Zooming fires moveend for
// every notch of the wheel; asking the server on each one made the map stutter
// and put dozens of requests in flight that nothing would ever read.
function onMoved() {
  clearTimeout(moveTimer);
  moveTimer = setTimeout(() => {
    loadPoints();
    considerScrape();
  }, 260);
}

// The visible box, or nothing when the whole globe is in view.
function visibleBox() {
  if (map.getZoom() < 2.5) return null;
  try {
    const b = map.getBounds();
    const w = b.getWest(), s = b.getSouth(), e = b.getEast(), n = b.getNorth();
    if (![w, s, e, n].every(Number.isFinite)) return null;
    if (e - w >= 355) return null; // effectively the whole world
    return [w, s, e, n];
  } catch (_) { return null; }
}

async function loadPoints() {
  const token = ++loadToken;
  const box = visibleBox();
  const url = "/v1/points?limit=40000" + (box ? "&bbox=" + box.map(v => v.toFixed(4)).join(",") : "");

  try {
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    if (token !== loadToken) return;      // a newer view is already in flight

    const source = map.getSource("museums");
    if (!source) return;
    source.setData({
      type: "FeatureCollection",
      features: data.points.map(p => ({
        type: "Feature",
        geometry: { type: "Point", coordinates: [p[2], p[1]] },
        properties: { id: p[0] },
      })),
    });

    hud.innerHTML = "<b>" + data.count.toLocaleString() + "</b> museums shown" +
      (data.truncated ? " — most notable at this scale, zoom in for the rest" : "");
  } catch (_) { /* keep whatever is already drawn */ }
}

/* ---- filling in an area nobody has looked at ---------------------------- */

// Asking the server to read the museums' own websites for whatever is on show
// here. Bounded on the server — one area at a time, a cap per area, a day's
// cooldown — because this turns panning a map into traffic on other people's
// sites.
let scrapeAsked = new Set(), scrapeTimer = null;

function areaOf() {
  const c = map.getCenter();
  const b = map.getBounds();
  // Half the diagonal, which is the radius that covers the visible rectangle.
  const km = Math.max(
    haversine(c.lat, c.lng, b.getNorth(), b.getEast()),
    haversine(c.lat, c.lng, b.getSouth(), b.getWest()));
  return { lat: c.lat, lon: c.lng, radiusKm: km };
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

async function considerScrape() {
  // Only when the view is a place rather than a continent: scraping "Europe"
  // is neither useful nor polite.
  const area = areaOf();
  if (!Number.isFinite(area.radiusKm) || area.radiusKm > 60 || map.getZoom() < 8) return;

  const key = area.lat.toFixed(1) + "," + area.lon.toFixed(1);
  if (scrapeAsked.has(key)) return;
  scrapeAsked.add(key);

  try {
    const params = new URLSearchParams({
      lat: area.lat.toFixed(5), lon: area.lon.toFixed(5),
      radius_km: Math.max(1, Math.min(area.radiusKm, 60)).toFixed(1),
    });
    const res = await fetch("/v1/scrape?" + params, { method: "POST" });
    if (!res.ok) return;
    const data = await res.json();
    if (data.state === "queued" || data.state === "running") {
      note("Looking for exhibitions here…");
      watchScrape(area);
    }
  } catch (_) {}
}

// Polls until the area is done, then reloads whatever is open so the new
// listings appear without the visitor doing anything.
function watchScrape(area) {
  clearTimeout(scrapeTimer);
  scrapeTimer = setTimeout(async () => {
    try {
      const params = new URLSearchParams({
        lat: area.lat.toFixed(5), lon: area.lon.toFixed(5),
        radius_km: Math.max(1, Math.min(area.radiusKm, 60)).toFixed(1),
      });
      const res = await fetch("/v1/scrape?" + params);
      const data = await res.json();
      if (data.state === "queued" || data.state === "running") {
        watchScrape(area);
        return;
      }
      note("");
      if (openMuseum) loadShows(openMuseum);
    } catch (_) { note(""); }
  }, 4000);
}

const noteEl = document.createElement("span");
function note(text) {
  noteEl.textContent = text ? "  ·  " + text : "";
  if (!noteEl.parentNode) hud.appendChild(noteEl);
}

/* ---- the museum window -------------------------------------------------- */

const detail = document.getElementById("detail");
const detailBody = document.getElementById("detailBody");

document.getElementById("close").onclick = closeDetail;
function closeDetail() {
  detail.style.display = "none";
  openMuseum = null;
  if (map.getLayer("museum-selected")) {
    map.setFilter("museum-selected", ["==", ["get", "id"], -1]);
  }
}

function escape(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let openMuseum = null;

async function showMuseum(id) {
  let museum;
  try {
    const res = await fetch("/v1/museums/" + encodeURIComponent(id));
    if (!res.ok) return;
    museum = await res.json();
  } catch (_) { return; }

  const where = [museum.locality, museum.country].filter(Boolean).join(", ");
  const tags = [];
  if (museum.verified) tags.push("Wikipedia article");
  if (museum.approximate_location) tags.push("position approximate — town centre");

  detailBody.innerHTML =
    "<h2>" + escape(museum.name) + "</h2>" +
    (where ? '<div class="where">' + escape(where) + "</div>" : "") +
    tags.map(t => '<span class="tag">' + escape(t) + "</span>").join("") +
    (museum.description ? '<div class="desc">' + escape(museum.description) + "</div>" : "") +
    (museum.website ? '<div><a href="' + escape(museum.website) + '" target="_blank" rel="noopener">Website</a></div>' : "") +
    (museum.wikipedia_url ? '<div><a href="' + escape(museum.wikipedia_url) + '" target="_blank" rel="noopener">Wikipedia</a></div>' : "") +
    '<div class="shows" id="shows"><h3>What\'s on</h3><div class="where">Looking…</div></div>';

  detail.style.display = "block";
  listPanel.style.display = "none";
  openMuseum = museum;

  if (Number.isFinite(museum.latitude) && (museum.latitude || museum.longitude)) {
    map.flyTo({
      center: [museum.longitude, museum.latitude],
      zoom: Math.max(map.getZoom(), 14),
      speed: 1.4,
    });
    if (map.getLayer("museum-selected")) {
      map.setFilter("museum-selected", ["==", ["get", "id"], Number(museum.id)]);
    }
  }
  loadShows(museum);
}

async function loadShows(museum) {
  const box = document.getElementById("shows");
  if (!box) return;
  if (!Number.isFinite(museum.latitude)) { box.innerHTML = ""; return; }

  try {
    const res = await fetch("/v1/exhibitions?lat=" + museum.latitude + "&lon=" + museum.longitude +
                            "&radius_km=1&upcoming=true&limit=40");
    const data = await res.json();
    // Exhibitions are stored per venue; the radius is only how they are found,
    // so the ones belonging to this museum are those naming it.
    const mine = data.exhibitions.filter(e => e.museum === museum.name);

    if (!mine.length) {
      const note = data.coverage && data.coverage.last_scraped
        ? "Nothing listed for this museum."
        : "This area has not been scraped for exhibitions yet.";
      box.innerHTML = "<h3>What's on</h3><div class=\"where\">" + note + "</div>";
      return;
    }

    box.innerHTML = "<h3>What's on</h3>" + mine.map(e => {
      const when = [e.start ? "from " + e.start.slice(0, 10) : "",
                    e.end ? "until " + e.end.slice(0, 10) : ""].filter(Boolean).join(" ");
      const title = e.url
        ? '<a href="' + escape(e.url) + '" target="_blank" rel="noopener">' + escape(e.title) + "</a>"
        : escape(e.title);
      return '<div class="show">' + title +
             (when ? '<div class="when">' + escape(when) + "</div>" : "") + "</div>";
    }).join("");
  } catch (_) {
    box.innerHTML = "<h3>What's on</h3><div class=\"where\">Could not load.</div>";
  }
}

/* ---- search ------------------------------------------------------------- */

const q = document.getElementById("q");
const results = document.getElementById("results");
let searchTimer = null, searchToken = 0, hits = [], cursor = -1;

q.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const term = q.value.trim();
  if (!term) { results.innerHTML = ""; hits = []; cursor = -1; return; }
  searchTimer = setTimeout(() => runSearch(term), 180);
});

// Arrow keys and Enter, because a search box that only takes the mouse is a
// half-finished search box.
q.addEventListener("keydown", e => {
  if (e.key === "Escape") { results.innerHTML = ""; hits = []; cursor = -1; q.blur(); return; }
  if (!hits.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    cursor = (cursor + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
    for (const [i, el] of [...results.children].entries()) el.classList.toggle("active", i === cursor);
    results.children[cursor]?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    choose(hits[Math.max(cursor, 0)]);
  }
});

// Places and museums together, because "Gothenburg" and "Röhsska Museum" are
// the same question asked at different scales, and a box that only knows one of
// them sends you away to find the other.
async function runSearch(term) {
  const token = ++searchToken;

  const [museums, places] = await Promise.all([
    fetchJSON("/v1/search?q=" + encodeURIComponent(term) + "&limit=10"),
    fetchJSON("/v1/places?q=" + encodeURIComponent(term)),
  ]);
  if (token !== searchToken) return;

  // Places lead: someone typing a city name wants to go there, and the museums
  // in it are what they will see when they arrive.
  hits = [
    ...(places?.places || []).map(p => ({ kind: "place", ...p })),
    ...(museums?.museums || []).map(m => ({ kind: "museum", ...m })),
  ];
  cursor = -1;

  if (!hits.length) {
    results.innerHTML = '<div class="hit"><small>Nothing found</small></div>';
    return;
  }

  results.innerHTML = hits.map((h, i) => h.kind === "place"
    ? '<div class="hit" data-i="' + i + '"><b>◎ ' + escape(h.name) + "</b>" +
      '<small>place · ' + h.radius_km.toFixed(0) + " km across</small></div>"
    : '<div class="hit" data-i="' + i + '"><b>' + escape(h.name) + "</b><small>" +
      escape([h.locality, h.country].filter(Boolean).join(", ")) +
      (h.locatable ? "" : " · position unknown") + "</small></div>").join("");

  for (const el of results.querySelectorAll(".hit[data-i]")) {
    el.onclick = () => choose(hits[Number(el.dataset.i)]);
  }
}

async function fetchJSON(url) {
  try {
    const res = await fetch(url);
    return res.ok ? await res.json() : null;
  } catch (_) { return null; }
}

// A place flies the map there and lets the arrival trigger a scrape; a museum
// opens its window.
function choose(hit) {
  if (hit.kind === "place") {
    results.innerHTML = ""; hits = []; cursor = -1;
    closeDetail();
    map.flyTo({
      center: [hit.longitude, hit.latitude],
      zoom: zoomForRadius(hit.radius_km),
      speed: 1.3,
    });
    showArea(hit);
    return;
  }
  showMuseum(hit.id);
}

/* ---- what is in the place you searched for ------------------------------ */

const listPanel = document.getElementById("list");
const listBody = document.getElementById("listBody");
document.getElementById("listClose").onclick = () => listPanel.style.display = "none";

// Searching a city should answer "what is here", not just move the camera and
// leave you to find the dots yourself.
async function showArea(place) {
  listPanel.style.display = "block";
  listBody.innerHTML = '<h2>' + escape(place.name.split(",")[0]) + "</h2>" +
                       '<div class="count">Looking…</div>';

  const params = new URLSearchParams({
    lat: place.latitude, lon: place.longitude,
    radius_km: Math.min(place.radius_km || 15, 50), limit: "200",
  });

  const data = await fetchJSON("/v1/museums?" + params);
  if (!data) { listBody.innerHTML = '<h2>' + escape(place.name.split(",")[0]) +
                                    "</h2><div class=\"count\">Could not load.</div>"; return; }

  const shown = data.museums.length;
  const total = data.total;
  listBody.innerHTML =
    "<h2>" + escape(place.name.split(",")[0]) + "</h2>" +
    '<div class="count">' + total.toLocaleString() + " museum" + (total === 1 ? "" : "s") +
    " within " + Math.round(Number(params.get("radius_km"))) + " km" +
    (shown < total ? " · showing the nearest " + shown : "") + "</div>" +
    data.museums.map(m =>
      '<div class="row" data-id="' + m.id + '">' + escape(m.name) +
      "<small>" + m.distance_km.toFixed(1) + " km" +
      (m.locality ? " · " + escape(m.locality) : "") + "</small></div>").join("");

  for (const row of listBody.querySelectorAll(".row[data-id]")) {
    row.onclick = () => showMuseum(row.dataset.id);
  }
}

// A radius in kilometres as a zoom level: each level halves the span, and
// level 9 is roughly a 40 km view at the equator.
function zoomForRadius(km) {
  const z = 9 - Math.log2(Math.max(km, 1) / 20);
  return Math.max(3, Math.min(15, z));
}
</script>
